apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "leadpipe.fullname" . }}-config
  labels:
    {{- include "leadpipe.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  DB_HOST: {{ required "database.host is required" .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_SSLMODE: {{ .Values.database.sslmode | quote }}
  DB_POOL_MAX: {{ .Values.database.poolMax | quote }}
  REDIS_HOST: {{ include "leadpipe.redisHost" . | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
