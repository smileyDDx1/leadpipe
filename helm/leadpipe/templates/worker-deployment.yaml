apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leadpipe.fullname" . }}-worker
  labels:
    {{- include "leadpipe.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "leadpipe.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "leadpipe.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ .Values.secrets.checksum | default (toJson .Values.secrets.values | sha256sum) | quote }}
    spec:
      automountServiceAccountToken: false
      # On SIGTERM the worker finishes its current batch. Jobs left unfinished are reclaimed.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "leadpipe.image" (dict "root" . "repository" .Values.worker.repository) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "leadpipe.fullname" . }}-config
          env:
            {{- include "leadpipe.dbCredentialsEnv" . | nindent 12 }}
          # The worker has no HTTP port, so these probes read the loop's heartbeat file.
          startupProbe:
            exec:
              command: ["python", "-m", "leadpipe_worker.healthcheck"]
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["python", "-m", "leadpipe_worker.healthcheck"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["python", "-m", "leadpipe_worker.healthcheck"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
