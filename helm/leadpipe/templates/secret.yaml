{{- if .Values.secrets.create }}
# A hook resource, because the migration Job needs it before Helm creates ordinary resources.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "leadpipe.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DB_USER: {{ required "secrets.values.dbUser is required" .Values.secrets.values.dbUser | quote }}
  DB_PASSWORD: {{ required "secrets.values.dbPassword is required" .Values.secrets.values.dbPassword | quote }}
  API_KEY: {{ required "secrets.values.apiKey is required" .Values.secrets.values.apiKey | quote }}
{{- end }}
