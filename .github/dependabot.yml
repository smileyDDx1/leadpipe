# Pinning to commit SHAs and hashes is only safe if something keeps the pins up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/app/api, /app/worker]
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories: [/app/api, /app/worker]
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/main
      - /infra/modules/*
    schedule:
      interval: weekly
