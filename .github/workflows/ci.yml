# Runs on every pull request, and on main so the status badge shows the current state.
# The `ci-passed` job is the one required check for merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.1
  TERRAFORM_VERSION: 1.17.1
  # Trivy runs from a digest-pinned image. A tag cannot be repointed at different code, which
  # matters here: trivy-action's own tags were hijacked in a March 2026 supply chain attack.
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  lint-and-test:
    name: Lint and unit test (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]
    defaults:
      run:
        working-directory: app/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/${{ matrix.service }}/requirements*.txt
      - name: Install dependencies
        run: |
          pip install --require-hashes --requirement requirements.txt
          pip install --requirement requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest --cov=leadpipe_${{ matrix.service }} --cov-report=term

  build-and-scan:
    name: Build and scan (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/${{ matrix.service }}
          load: true
          tags: leadpipe/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan image, failing on critical vulnerabilities
        env:
          IMAGE: leadpipe/${{ matrix.service }}:${{ github.sha }}
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "${TRIVY_IMAGE}" image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "${IMAGE}"

  compose-e2e:
    name: End-to-end test on Docker Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Run the end-to-end check
        run: python3 scripts/e2e_check.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

  chart:
    name: Deploy the chart to kind
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Lint and validate every values file
        run: scripts/validate-chart.sh
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true
      # The same script used on a laptop, including the smoke test and automatic rollback.
      - name: Create the cluster and deploy
        env:
          TAG: ${{ github.sha }}
        run: scripts/kind-up.sh "${TAG}"
      - name: Run the end-to-end check against the cluster
        run: |
          kubectl --namespace leadpipe port-forward service/leadpipe-api 8080:80 &
          sleep 3
          python3 scripts/e2e_check.py http://localhost:8080
      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl --namespace leadpipe get all,events
          kubectl --namespace leadpipe logs --selector app.kubernetes.io/name=leadpipe --all-containers --tail 50

  terraform:
    name: Terraform format, validate and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive -diff infra
      # Needs no AWS account: `terraform test` runs against a mocked provider.
      - name: Validate and test every config
        run: scripts/test-terraform.sh

  ci-passed:
    name: CI passed
    if: always()
    needs: [lint-and-test, build-and-scan, compose-e2e, chart, terraform]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          for result in ${RESULTS}; do
            [ "${result}" = "success" ] || exit 1
          done
